name: oplora-nanogpt-test

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_oplora_nanogpt.py'
      - 'src/peft/**'
      - '.github/workflows/oplora-nanogpt.yml'
  pull_request:
    paths:
      - 'tests/test_oplora_nanogpt.py'
      - 'src/peft/**'
      - '.github/workflows/oplora-nanogpt.yml'

env:
  HF_HOME: .cache/huggingface

permissions: {}

jobs:
  oplora-nanogpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "setup.py"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run OPLoRA NanoGPT regression
        env:
          PYTHONPATH: src
        run: pytest --override-ini addopts= tests/test_oplora_nanogpt.py
